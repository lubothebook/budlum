---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: budlum-faucet
  namespace: budlum-testnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budlum-faucet
  template:
    metadata:
      labels:
        app: budlum-faucet
    spec:
      containers:
        - name: faucet
          image: budlum-faucet:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: FAUCET_RPC_URL
              value: "http://budlum-rpc.budlum-testnet.svc.cluster.local:18545"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: budlum-faucet
  namespace: budlum-testnet
spec:
  selector:
    app: budlum-faucet
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer
