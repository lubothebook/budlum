# Alertmanager configuration for Budlum testnet.
# Place alongside prometheus-testnet.yml.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'

receivers:
  - name: 'default'
    # Configure webhook or email here.
    # webhook_configs:
    #   - url: 'http://localhost:9095/alerts'

# Inhibition rules: suppress noisy alerts when a more severe one fires.
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
